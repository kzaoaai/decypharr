# Builds this branch's Dockerfile and pushes it to GHCR when a v*-aa* tag is
# pushed. The upstream release, beta and docs workflows are removed on this
# branch so a tag here never tries to publish upstream's artifacts.
name: image

on:
  push:
    tags: ["v*-aa*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/decypharr:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            CHANNEL=patched
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Digest
        run: echo "ghcr.io/${{ github.repository_owner }}/decypharr@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
